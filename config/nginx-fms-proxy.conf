# nginx-fms-proxy.conf — template server block: serve a web app and
# reverse-proxy /fmi/ to an internal FileMaker Server.
# Drop into /etc/nginx/sites-available/ (Debian-style) or conf.d/,
# adjust the placeholders, then `nginx -t && nginx -s reload`.
# See docs/reverse-proxy.md for the full guide.

server {
    listen 443 ssl http2;
    server_name fms.example.com;                    # ← your public hostname

    ssl_certificate     /etc/letsencrypt/live/fms.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fms.example.com/privkey.pem;

    # ... your existing locations ...

    # --- Serve the web app (files deployed to the web root) ---
    location /my-web-app/ {                          # ← your app path
        alias /var/www/my-web-app/;                  # ← your deploy dir
        try_files $uri $uri/ =404;
    }

    # --- Reverse-proxy /fmi/ to the internal FileMaker Server ---
    location /fmi/ {
        proxy_pass https://192.168.x.x/fmi/;         # ← FMS internal IP (trailing /fmi/ required)
        proxy_ssl_verify off;                        # FMS self-signed cert — required
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffers 8 16k;
        proxy_buffer_size 16k;
        proxy_read_timeout 60s;
    }

    # Optional: expose ONLY OData, not all of /fmi/ (webd, admin-console…)
    # location /fmi/odata/ {
    #     proxy_pass https://192.168.x.x/fmi/odata/;
    #     proxy_ssl_verify off;
    # }
}
