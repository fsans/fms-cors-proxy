# apache-cors-location.conf — CORS <Location "/fmi"> block for
# FileMaker Server's Apache.
# Paste into BOTH /Library/FileMaker Server/HTTPServer/conf/httpd.conf
# AND httpd.conf.2.4 (see "Which config file to edit" in docs/cors.md),
# then: sudo launchctl kickstart -k system/com.filemaker.httpd.graceful
#
# Remember to also remove/comment the OLD global CORS headers elsewhere
# in the file (Access-Control-Allow-Origin ${SERVER_NAME} …).

<Location "/fmi">
    Header set X-Content-Type-Options nosniff

    # Set cookie expiration date (12 hours in seconds), path and httponly
    Header edit Set-Cookie ^(.*(JSESSIONID).*)$ $1;Max-Age=43200

    # CORS: reflect Origin only for trusted LAN origins (adjust subnet).
    # The port part (:port)? is REQUIRED — browsers send Origin with port.
    RewriteEngine On
    RewriteCond %{HTTP:Origin} ^http://192\.168\.x\.[0-9]{1,3}(:[0-9]+)?$ [NC]
    RewriteRule ^ - [E=ALLOW_ORIGIN:%{HTTP:Origin}]

    Header always set Access-Control-Allow-Origin "%{ALLOW_ORIGIN}e" env=ALLOW_ORIGIN
    Header always set Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization, odata-maxversion, odata-version, Prefer, OData-MaxVersion, OData-Version"
    Header always set Access-Control-Allow-Methods "PATCH, GET, POST, DELETE, OPTIONS"
    Header always set Access-Control-Allow-Credentials "true"

    # Answer preflights with 200 + empty body
    RewriteCond %{REQUEST_METHOD} OPTIONS
    RewriteRule ^ - [R=200,L]

</Location>
